<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1>GestiShop - Produits</h1>
    <form id="formulaire" novalidate>
      <div class="champ">
        <label for="nom">Nom produit:</label>
        <input type="text" id="nom" name="nom" required />
        <span class="erreur" id="erreur-nom"></span>
      </div>
      
      <div class="champ">
        <label for="categorie">Catégorie:</label>
        <select id="categorie" name="categorie" required>
          <option value="">Sélectionnez une catégorie</option>
          <option value="informatique">informatique</option>
          <option value="telephonie">telephonie</option>
          <option value="bureautique">bureautique</option>
        </select>
        <span class="erreur" id="erreur-categorie"></span>
      </div>
      
      <div class="champ">
        <label for="prix">Prix (FCFA):</label>
        <input type="number" id="prix" min="1" required />
        <span class="erreur" id="erreur-prix"></span>
      </div>
      <div class="champ">
        <label for="stock">Quantité en stock:</label>
        <input type="number" id="stock" min="0" required />
        <span class="erreur" id="erreur-stock"></span>
      </div>
      
      <div class="champ">
        <label for="note">Note(0 à 5):</label>
        <input type="number" id="note" min="0" max="5" step="0.1" required />
        <span class="erreur" id="erreur-note"></span>
      </div>
      
      <div class="boutons">
        <button type="submit" id="btn-valider">Ajouter</button>
        <button type="button" id="btn-annuler">Annuler</button>
      </div>
    </form>

    <div class="barre">
        <input type="text" id="recherche" placeholder="Rechercher un produit..." />
        <select id="filtre-categorie">
          <option value="">Toutes les catégories</option>
          <option value="informatique">informatique</option>
          <option value="telephonie">telephonie</option>
          <option value="bureautique">bureautique</option>
        </select>
        <button type="button" id="btn-reinitialiser">Réinitialiser</button>
    </div>
    <table id="tableau">
      <thead>
        <tr>
          <th>#</th>
          <th>Nom</th>
          <th>Catégorie</th>
          <th>Prix (FCFA)</th>
          <th>Quantité en stock</th>
          <th>Note</th>
          <th>Total</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="liste"></tbody>
    </table>
    <p id="message-vide">Aucun produit disponible.</p>
    <div class="stats">
        <div>Nombre de produits <strong id="stat-produit">0</strong></div>
          <div>Valeur totale du stock <strong id="stat-valeur">0</strong> FCFA</div>
            <div>Produits en rupture  <strong id="stat-rupture">0</strong></div>
              <div>Note moyenne <strong id="stat-note">0</strong></div>
    </div>

  </body>
  <script type="module" src="app.js"></script>
</html>
